name: build

# 手动触发（Actions 页面点 "Run workflow"）或推送 main 分支时云端编译
on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch:        # ✚ 手动触发：仓库 Actions → build → Run workflow

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Windows 提交的仓库在 Linux runner 上会丢失 gradlew 执行位，必须显式授权
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build plugin (shadowJar)
        run: ./gradlew build shadowJar --no-daemon

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XMPlayerMarketPlus
          path: |
            out/*.jar
            build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Show build outputs
        run: ls -lh out/ build/libs/ 2>/dev/null || true
